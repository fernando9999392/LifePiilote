 <!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifePilote</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
  background:
    radial-gradient(circle at 20% 0%,#29115f 0%,transparent 35%),
    radial-gradient(circle at 90% 20%,#102e67 0%,transparent 35%),
    #050817;
  color:#f4f5ff;
  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  width:500px;
  height:500px;
  background:rgba(125,65,255,.12);
  filter:blur(100px);
  top:-200px;
  right:-150px;
  pointer-events:none;
}

.app{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:18px 18px 120px;
}

/* HEADER */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 4px 20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:13px;
}

.logo{
  width:58px;
  height:58px;
  border-radius:19px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:22px;
  background:linear-gradient(135deg,#9b4dff,#168fff,#17d6c4);
  box-shadow:0 0 28px rgba(104,69,255,.45);
}

.brand h1{
  font-size:31px;
  letter-spacing:-1px;
}

.brand p{
  color:#a8afd0;
  font-size:15px;
  margin-top:3px;
}

.online{
  color:#62f5dc;
  font-size:14px;
  display:flex;
  align-items:center;
  gap:7px;
}

.online span{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#55efd7;
  box-shadow:0 0 12px #55efd7;
}

/* CHAT */

.chat-card{
  min-height:650px;
  border:1px solid rgba(105,107,255,.45);
  border-radius:28px;
  padding:22px;
  background:rgba(10,17,42,.82);
  backdrop-filter:blur(20px);
  box-shadow:
    0 25px 80px rgba(0,0,0,.35),
    inset 0 1px rgba(255,255,255,.04);
}

.messages{
  min-height:520px;
  display:flex;
  flex-direction:column;
  gap:16px;
  overflow-y:auto;
  padding:5px 2px 20px;
}

.message{
  max-width:78%;
  padding:15px 18px;
  border-radius:20px;
  line-height:1.55;
  font-size:17px;
  animation:appear .25s ease;
}

@keyframes appear{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}

.ai{
  align-self:flex-start;
  background:linear-gradient(135deg,#111b42,#151d3d);
  border:1px solid rgba(94,117,255,.28);
}

.user{
  align-self:flex-end;
  background:linear-gradient(135deg,#8147ff,#536fff);
  box-shadow:0 10px 30px rgba(101,74,255,.22);
}

.ai-wrap{
  display:flex;
  gap:10px;
  align-items:flex-start;
}

.mini-logo{
  flex:none;
  width:42px;
  height:42px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  background:linear-gradient(135deg,#853cff,#0b9cff);
  box-shadow:0 0 18px rgba(96,75,255,.35);
}

.time{
  color:#7d86ae;
  font-size:12px;
  margin-top:5px;
  margin-left:52px;
}

/* WEB SEARCH */

.searching{
  align-self:flex-start;
  width:min(78%,600px);
  padding:17px 20px;
  border-radius:20px;
  border:1px solid rgba(125,83,255,.45);
  background:linear-gradient(135deg,#101b48,#101735);
  animation:appear .25s ease;
}

.search-title{
  color:#b985ff;
  font-weight:bold;
  font-size:16px;
}

.search-sub{
  color:#8e99c5;
  margin-top:5px;
  font-size:14px;
}

.dots{
  display:flex;
  gap:7px;
  margin-top:13px;
}

.dots i{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#9c61ff;
  animation:bounce 1s infinite;
}

.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}

@keyframes bounce{
  0%,100%{transform:translateY(0);opacity:.4}
  50%{transform:translateY(-5px);opacity:1}
}

/* COMPOSER */

.composer{
  display:flex;
  gap:10px;
  align-items:center;
  border:1px solid rgba(113,95,255,.55);
  border-radius:28px;
  padding:7px 8px 7px 17px;
  background:rgba(7,12,30,.85);
}

.composer textarea{
  flex:1;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  font-size:16px;
  font-family:inherit;
  min-height:42px;
  padding:10px 0;
}

.composer textarea::placeholder{
  color:#7780aa;
}

.send{
  width:52px;
  height:52px;
  border:0;
  border-radius:50%;
  cursor:pointer;
  color:white;
  font-size:23px;
  background:linear-gradient(135deg,#9b4dff,#506cff);
  box-shadow:0 0 25px rgba(121,71,255,.45);
}

.send:active{
  transform:scale(.94);
}

/* NAV */

.nav{
  position:fixed;
  z-index:20;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);
  width:calc(100% - 24px);
  max-width:1000px;
  padding:10px;
  border-radius:28px;
  border:1px solid rgba(73,105,255,.42);
  background:rgba(6,12,29,.9);
  backdrop-filter:blur(22px);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  box-shadow:0 15px 50px rgba(0,0,0,.45);
}

.nav button{
  border:0;
  background:transparent;
  color:#8993bb;
  cursor:pointer;
  padding:9px 3px;
  border-radius:20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  font-size:12px;
}

.nav button.active{
  color:white;
  background:rgba(110,72,255,.14);
}

.icon{
  width:32px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

.nav button:nth-child(1).active .icon{color:#a875ff}
.nav button:nth-child(2).active .icon{color:#5795ff}
.nav button:nth-child(3).active .icon{color:#28e1c3}
.nav button:nth-child(4).active .icon{color:#ffc84e}
.nav button:nth-child(5).active .icon{color:#d47cff}

/* RESPONSIVE */

@media(max-width:600px){
  .app{
    padding:12px 12px 105px;
  }

  .brand h1{
    font-size:28px;
  }

  .logo{
    width:52px;
    height:52px;
  }

  .chat-card{
    min-height:650px;
    padding:15px;
    border-radius:25px;
  }

  .messages{
    min-height:530px;
  }

  .message{
    max-width:88%;
    font-size:16px;
  }

  .searching{
    width:88%;
  }

  .nav{
    bottom:7px;
    width:calc(100% - 14px);
  }

  .nav button{
    font-size:11px;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="brand">
      <div class="logo">LP</div>
      <div>
        <h1>LifePilote</h1>
        <p>Seu copiloto pessoal</p>
      </div>
    </div>

    <div class="online">
      <span></span>
      Online
    </div>
  </header>

  <main class="chat-card">

    <div class="messages" id="messages">

      <div class="ai-wrap">
        <div class="mini-logo">LP</div>
        <div>
          <div class="message ai">
            Olá! Eu sou o LifePilote. 🧠<br><br>
            Agora estou conectado ao cérebro online.
            Posso conversar com você e, quando apropriado,
            criar tarefas, concluir tarefas, criar compromissos
            e objetivos.
          </div>
          <div class="time">Agora</div>
        </div>
      </div>

    </div>

    <div class="composer">
      <textarea
        id="input"
        placeholder="Digite sua mensagem..."
        rows="1"
      ></textarea>

      <button class="send" onclick="sendMessage()">➤</button>
    </div>

  </main>

</div>

<nav class="nav">

  <button class="active" onclick="setActive(this)">
    <div class="icon">⌂</div>
    <span>Início</span>
  </button>

  <button onclick="setActive(this)">
    <div class="icon">▣</div>
    <span>Agenda</span>
  </button>

  <button onclick="setActive(this)">
    <div class="icon">✓</div>
    <span>Tarefas</span>
  </button>

  <button onclick="setActive(this)">
    <div class="icon">◎</div>
    <span>Objetivos</span>
  </button>

  <button onclick="setActive(this)">
    <div class="icon">✦</div>
    <span>IA</span>
  </button>

</nav>

<script>

const input = document.getElementById("input");
const messages = document.getElementById("messages");

input.addEventListener("keydown",function(e){
  if(e.key==="Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

function timeNow(){
  return new Date().toLocaleTimeString("pt-BR",{
    hour:"2-digit",
    minute:"2-digit"
  });
}

function addUserMessage(text){

  const div=document.createElement("div");
  div.className="message user";
  div.innerHTML=
    escapeHtml(text)+
    `<div style="font-size:11px;text-align:right;opacity:.65;margin-top:4px">
      ${timeNow()} ✓✓
    </div>`;

  messages.appendChild(div);
  scrollBottom();
}

function addAIMessage(text){

  const wrap=document.createElement("div");
  wrap.className="ai-wrap";

  wrap.innerHTML=`
    <div class="mini-logo">LP</div>
    <div>
      <div class="message ai">${formatText(text)}</div>
      <div class="time">${timeNow()}</div>
    </div>
  `;

  messages.appendChild(wrap);
  scrollBottom();
}

function showSearching(){

  const div=document.createElement("div");
  div.className="searching";
  div.id="searching";

  div.innerHTML=`
    <div class="search-title">🌐 Buscando na web...</div>
    <div class="search-sub">
      Vou verificar as informações mais recentes para te ajudar.
    </div>
    <div class="dots">
      <i></i><i></i><i></i>
    </div>
  `;

  messages.appendChild(div);
  scrollBottom();
}

function removeSearching(){

  const search=document.getElementById("searching");

  if(search){
    search.remove();
  }
}

async function sendMessage(){

  const text=input.value.trim();

  if(!text) return;

  addUserMessage(text);
  input.value="";

  /*
    Por enquanto mostramos a animação enquanto
    o servidor responde.
    Depois vamos conectar isso à busca REAL na web.
  */

  showSearching();

  try{

    const response=await fetch("/api/chat",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        message:text
      })
    });

    const data=await response.json();

    removeSearching();

    if(data.reply){
      addAIMessage(data.reply);
    }else{
      addAIMessage("Desculpe, não consegui responder agora.");
    }

  }catch(error){

    removeSearching();

    addAIMessage(
      "Tive um problema para me conectar ao meu cérebro online. 😕"
    );

  }
}

function setActive(button){

  document.querySelectorAll(".nav button")
    .forEach(b=>b.classList.remove("active"));

  button.classList.add("active");
}

function scrollBottom(){

  setTimeout(()=>{
    messages.scrollTop=messages.scrollHeight;
  },50);
}

function escapeHtml(text){

  const div=document.createElement("div");
  div.textContent=text;
  return div.innerHTML;
}

function formatText(text){

  return escapeHtml(text)
    .replace(/\n/g,"<br>")
    .replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>");
}

</script>

</body>
</html>
